[package]
name = "ikigai-http"
version = "0.1.9"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Outbound HTTP-client ikigai module: one endpoint per method (urn:httpGet…urn:httpDelete) with the ROC verb mirroring HTTP idempotency, a urn:cap:net host/path-ACL, golden-thread + time-based caching. A cfg-gated backend links into native and wasm32 hosts from one crate."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-http"
homepage = "https://github.com/ikigai-rs/ikigai-http"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module", "http"]
categories = ["web-programming::http-client", "wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core`. 0.1.12 carries the time-cache surface
# this module needs: `Expiry::At` / `Representation::cacheable_until`, the injected
# `Clock`, and `Invocation::now`.
#
# 0.1.86 is a SAFETY floor, not an API one (Error::NotFound, from 0.1.47, is the
# newest API this crate calls). Through 0.1.85 `Capability::attenuate` and `clamp`
# dropped a `urn:cap:net:-<rule>` exclusion that the requested or carried side did
# not also name, so narrowing a host allow plus a path deny re-opened the denied
# path. 0.1.86 keeps every exclusion through both (ledger #858);
# `a_host_deny_survives_attenuate_and_clamp` fails below it.
ikigai-core = "0.1.86"
async-trait = "0.1"
# URL parsing (host/path extraction for the capability ACL); runtime-free.
url = "2"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`).
#
# 0.6.0 is the true minimum of the API the TEST uses: `Suite::host_named_space`
# (SPACE-NAME, 0.6.0: `space(transport)` is instance-built, so the host names it),
# `Suite::opt_out_check` (the per-check waiver the five pass-through actions need;
# `opt_out` would drop ENFORCED and CACHEABLE with it) and `Suite::live` (the
# declaration that makes "a web read with no freshness signal is live" a checked
# promise). Read the caret as a RANGE: `^0.6.0` is `<0.7.0`, a ceiling as well as a
# floor (field guide rule 5), so a 0.7 needs a deliberate bump here.
#
# Its own floor on ikigai-core (0.1.89) is above the library's, and every build
# that compiles the test resolves to it; the test's `EndpointSpace::named` and
# `space_iri` (0.1.89) ride on that edge. The library's pin above deliberately stays
# the true minimum of what the LIBRARY uses, so this raise changes nothing a
# consumer of the crate resolves.
ikigai-conformance = "0.6.0"
