[package]
name = "ikigai-http"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Outbound HTTP-client ikigai module: one endpoint per method (urn:http:get…urn:http:delete, plus WebDAV urn:http:propfind and urn:http:report) with the ROC verb mirroring HTTP idempotency, a urn:cap:net host/path-ACL, golden-thread + time-based caching. A cfg-gated backend links into native and wasm32 hosts from one crate."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-http"
homepage = "https://github.com/ikigai-rs/ikigai-http"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module", "http"]
categories = ["web-programming::http-client", "wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core`. 0.1.12 carries the time-cache surface
# this module needs: `Expiry::At` / `Representation::cacheable_until`, the injected
# `Clock`, and `Invocation::now`.
#
# 0.1.108 is the API floor (ledger #1546): the failure-class variants the status
# table answers with (`Error::Refused`, `RetryAfter`, `OverBudget`, `Unsupported`),
# `FailureClass` and `Error::class`, and `Description::fails`. Below it nothing here
# compiles. (The older SAFETY floor, 0.1.86, is subsumed: through 0.1.85 `attenuate`
# and `clamp` dropped a `urn:cap:net:-<rule>` exclusion, ledger #858, and
# `a_host_deny_survives_attenuate_and_clamp` still pins it.) Read the caret as a
# RANGE: `^0.1.108` admits every later 0.1.x, so no ceiling below the 0.1 line.
ikigai-core = "0.1.108"
async-trait = "0.1"
# URL parsing (host/path extraction for the capability ACL); runtime-free.
url = "2"
# The ecosystem's one base64 (ledger #1857), behind `ikigai_http::base64` so no
# module hand-rolls its own. 0.22 because it is the line already in the graph of
# the repos that adopt the helper (ikigai-cli pins `base64 = "0.22"`, ikigai-gonk
# resolves 0.22.1), so they link ONE copy. The API used (`Engine`,
# `general_purpose::STANDARD`, the four-variant `DecodeError`) is in 0.22.0. Read the
# caret as a RANGE: `^0.22.0` is `<0.23.0`, a ceiling as well as a floor (field
# guide rule 5). Pure Rust, no dependencies of its own, wasm-clean.
base64 = "0.22.0"
# `Retry-After`'s HTTP-date form (RFC 9110 §10.2.3, §5.6.7: IMF-fixdate plus the two
# obsolete forms a recipient must accept), parsed by the vetted crate rather than by
# hand (the field guide's "do not reimplement" rule). 1.0.3 is the version already
# in ikigai-cli's graph (through hyper), so the main host links ONE copy; the API used,
# `parse_http_date`, is 1.0's. No dependencies of its own; wasm-clean (it builds a
# `SystemTime` from the epoch and never reads the wall clock).
httpdate = "1.0.3"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`).
#
# 0.8.0 is the true minimum of the API the TEST uses: `Suite::required_on_mutating`
# and the REQUIRED check it reaches (0.8.0: `url` is the one required input, and
# dropping it must be refused typed on all six verbs), `Suite::host_named_space`
# (SPACE-NAME, 0.6.0: `space(transport)` is instance-built, so the host names it),
# `Suite::opt_out_check` (the per-check waiver the five pass-through actions need;
# `opt_out` would drop ENFORCED and CACHEABLE with it) and `Suite::live` (the
# declaration that makes "a web read with no freshness signal is live" a checked
# promise). Read the caret as a RANGE: `^0.8.0` is `<0.9.0`, a ceiling as well as a
# floor (field guide rule 5), so a 0.9 needs a deliberate bump here.
#
# Its own floor on ikigai-core (0.1.100) is below the library's 0.1.108 since 0.3.0,
# so it no longer lifts what the test builds against; the test's `EndpointSpace::named`
# and `space_iri` (0.1.89) are under both.
ikigai-conformance = "0.8.0"
# Reads `tests/vectors/auth_vectors.json`, the shared Authorization and base64 vectors
# Python and Deno pin a byte-identical copy of (ledger #1857). `Value` indexing only.
serde_json = "1"
