[package]
name = "ikigai-http"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Outbound HTTP-client ikigai module: one endpoint per method (urn:http:get…urn:http:delete, plus WebDAV urn:http:propfind and urn:http:report) with the ROC verb mirroring HTTP idempotency, a urn:cap:net host/path-ACL, golden-thread + time-based caching. A cfg-gated backend links into native and wasm32 hosts from one crate."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-http"
homepage = "https://github.com/ikigai-rs/ikigai-http"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module", "http"]
categories = ["web-programming::http-client", "wasm"]

[dependencies]
# 0.2.6 supplies stale offers, origin validators, and revalidated answers; 0.2.7
# keeps an answer that arrives already expired when it carries a validator.
ikigai-core = "0.2.7"
async-trait = "0.1"
# Runtime-independent AsyncRead for the host response-body seam.
futures-io = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["io", "std"] }
# URL parsing (host/path extraction for the capability ACL); runtime-free.
url = "2"
# The ecosystem's one base64 (ledger #1857), behind `ikigai_http::base64` so no
# module hand-rolls its own. 0.22 because it is the line already in the graph of
# the repos that adopt the helper (ikigai-cli pins `base64 = "0.22"`, ikigai-gonk
# resolves 0.22.1), so they link ONE copy. The API used (`Engine`,
# `general_purpose::STANDARD`, the four-variant `DecodeError`) is in 0.22.0. Read the
# caret as a RANGE: `^0.22.0` is `<0.23.0`, a ceiling as well as a floor (field
# guide rule 5). Pure Rust, no dependencies of its own, wasm-clean.
base64 = "0.22.0"
# `Retry-After`'s HTTP-date form (RFC 9110 §10.2.3, §5.6.7: IMF-fixdate plus the two
# obsolete forms a recipient must accept), parsed by the vetted crate rather than by
# hand (the field guide's "do not reimplement" rule). 1.0.3 is the version already
# in ikigai-cli's graph (through hyper), so the main host links ONE copy; the API used,
# `parse_http_date`, is 1.0's. No dependencies of its own; wasm-clean (it builds a
# `SystemTime` from the epoch and never reads the wall clock).
httpdate = "1.0.3"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`). 0.11.0 uses core
# 0.2.0 and enables DATATYPES and FAILURES by default.
ikigai-conformance = "0.11.0"
# Reads `tests/vectors/auth_vectors.json`, the shared Authorization and base64 vectors
# Python and Deno pin a byte-identical copy of (ledger #1857). `Value` indexing only.
serde_json = "1"
